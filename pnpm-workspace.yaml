packages:
  - "apps/*"
  - "packages/*"

# Every version is pinned here, once, like Directory.Packages.props under source/.
# A package.json refers to an entry with "catalog:".
catalog:
  "@base-ui/react": 1.9.0
  "@fontsource-variable/roboto": 5.3.0
  "@modelcontextprotocol/ext-apps": 2.0.4
  "@shadcn/react": 0.3.1
  "@tailwindcss/vite": 4.3.5
  "@tanstack/ai": 1.4.0
  "@tanstack/ai-anthropic": 1.1.1
  # Experimental: a minor release of the harness can change its API.
  "@tanstack/ai-harness": 0.3.0
  "@tanstack/ai-mcp": 1.2.0
  "@tanstack/ai-openai": 1.1.1
  "@tanstack/ai-persistence": 1.0.1
  "@tanstack/ai-react": 1.0.2
  "@tanstack/markdown": 1.2.0
  "@tanstack/react-router": 1.170.46
  "@tanstack/react-start": 1.169.5
  "@types/node": 26.6.6
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.3.0
  class-variance-authority: 0.7.1
  cn: 0.5.2
  lucide-react: 1.70.0
  # A release candidate: Nitro 3 has no stable release yet.
  nitro: 3.0.261103-rc
  react: 19.3.1
  react-dom: 19.3.1
  rollup-plugin-license: 3.7.2
  shadcn: 4.23.0
  srvx: 1.0.8
  tailwindcss: 4.3.5
  tw-animate-css: 1.4.0
  typescript: 7.0.2
  vite: 8.3.7
  vite-plugin-singlefile: 2.3.4
  zod: 4.6.7

# rollup-plugin-license lists the packages a bundler put into a file. It names Rollup as a peer.
# The card files are built by Vite on Rolldown, which calls the same hooks, so Rollup stays out.
packageExtensions:
  rollup-plugin-license:
    peerDependenciesMeta:
      rollup:
        optional: true

# Versions that were pinned before they were a day old, the age pnpm asks for by default. pnpm
# wrote this list. An entry can go once its version is older than a day.
minimumReleaseAgeExclude:
  - "@tanstack/ai-mcp@1.2.0"
  - "@tanstack/ai@1.4.0"
