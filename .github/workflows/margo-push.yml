name: Margo push

# Pushes the Margo app (margo/) with bart to the staging registry of FLECS, as the version of a tag.
# The workflow "Images" calls it for a version tag (v1.2.3), after it has published the images as 1.2.3; by hand
# it pushes a version whose images are already on ghcr.io. See margo/README.md, "Release".
on:
  workflow_call:
    inputs:
      version:
        description: Version to push, v1.2.3 or 1.2.3; the images of this repository must exist with that tag
        required: true
        type: string
      bart-version:
        description: Tag of the bart image to run
        required: false
        default: latest
        type: string
    secrets:
      BART_REGISTRY_USER:
        required: true
      BART_REGISTRY_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Version to push, v1.2.3 or 1.2.3; the images of this repository must exist with that tag
        required: true
        type: string
      bart-version:
        description: Tag of the bart image to run
        required: false
        default: latest
        type: string

permissions:
  contents: read

# One push at a time; a newer one waits for the one that runs.
concurrency:
  group: margo-push
  cancel-in-progress: false

jobs:
  margo-push:
    name: Push the Margo app
    runs-on: ubuntu-latest
    env:
      BART_IMAGE: cr.flecs.tech/flecs/bart:${{ inputs.bart-version }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      # "Images" tags the images 1.2.3, without the v. bart checks that the version is SemVer.
      - name: Version without the leading v
        run: echo "VERSION=${INPUT_VERSION#v}" >> "$GITHUB_ENV"

      # compose/compose.yaml names the images of this repository with the tag `main`. The app of a release takes
      # the images of that release, which "Images" published under the version. Only in this run; nothing is committed.
      - name: Pin the images of this repository to ${{ env.VERSION }}
        run: |
          set -eu
          COMPOSE=margo/compose/compose.yaml
          sed -Ei "s|^(\s*image:\s*ghcr\.io/united-machining-solutions/pleiades\.playground\.[a-z.]+):main$|\1:${VERSION}|" "$COMPOSE"
          if grep -Eq 'pleiades\.playground\.[a-z.]+:main$' "$COMPOSE"; then
            echo "::error file=$COMPOSE::an image of this repository is still on :main"
            exit 1
          fi
          grep -E '^\s*image:' "$COMPOSE"

      - name: bart validate
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" -w /workspace \
            "${BART_IMAGE}" validate --dir margo

      # Copies every image to <registry>/staging-<app id>/<service>:<version>, so the staged app no longer depends
      # on ghcr.io. The images there are public and need no --pull-auth.
      - name: bart push
        env:
          BART_REGISTRY_USER: ${{ secrets.BART_REGISTRY_USER }}
          BART_REGISTRY_TOKEN: ${{ secrets.BART_REGISTRY_TOKEN }}
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/workspace" -w /workspace \
            -e BART_REGISTRY_USER -e BART_REGISTRY_TOKEN \
            "${BART_IMAGE}" push --dir margo --version "${VERSION}"
