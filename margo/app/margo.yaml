apiVersion: margo/v1alpha1
kind: ApplicationDescription
id: com-github-united-machining-solutions-pleiades-playground
metadata:
  name: Pleiades Playground
  version: "0.0.0" # overwritten by `bart` from the git tag or --version
  description: >-
    An open playground for machine data: simulated machines publish to an MQTT broker, services store time
    series and events, and an example app with a chat shows them.
  catalog:
    organization:
      - name: United Machining Solutions
        site: https://github.com/united-machining-solutions
    application:
      tagline: Machine data over MQTT, REST and MCP, with an example app and a chat.
      icon: icon.svg
      descriptionFile: description.md
      releaseNotes: release-notes.md
      licenseFile: license.txt
      site: https://github.com/united-machining-solutions/Pleiades.Playground
      tags: ["playground", "mqtt", "mcp", "machine-data"]
deploymentProfiles:
  - type: compose
    id: default
    components:
      - name: default
        properties:
          repository: oci://example.com/pleiades-playground # overwritten by `bart`, this is just a placeholder
          revision: "0.0.0" # overwritten by `bart`, this is just a placeholder
    requiredResources:
      cpu:
        cores: 2
        architectures:
          - amd64
      # Estimates for thirteen containers and 30 days of retained data, not measured.
      memory: 4Gi
      storage: 20Gi

# Each parameter sets the ${VAR} of the same name in compose/compose.yaml.
parameters:
  appHost:
    value: "pleiades.example.internal"
    targets:
      - pointer: APP_HOST
        components: ["default"]
  serverHost:
    value: "device.example.internal"
    targets:
      - pointer: SERVER_HOST
        components: ["default"]
  httpBind:
    value: "127.0.0.1"
    targets:
      - pointer: HTTP_BIND
        components: ["default"]
  httpPort:
    value: 80
    targets:
      - pointer: HTTP_PORT
        components: ["default"]
  httpsPort:
    value: 443
    targets:
      - pointer: HTTPS_PORT
        components: ["default"]
  appBind:
    value: "127.0.0.1"
    targets:
      - pointer: APP_BIND
        components: ["default"]
  appPort:
    value: 5600
    targets:
      - pointer: APP_PORT
        components: ["default"]
  mqttPort:
    value: 1883
    targets:
      - pointer: MQTT_PORT
        components: ["default"]
  mqttWsPort:
    value: 9001
    targets:
      - pointer: MQTT_WS_PORT
        components: ["default"]
  timeseriesApiPort:
    value: 5500
    targets:
      - pointer: TIMESERIES_API_PORT
        components: ["default"]
  eventsApiPort:
    value: 5510
    targets:
      - pointer: EVENTS_API_PORT
        components: ["default"]
  sitesBind:
    value: "127.0.0.1"
    targets:
      - pointer: SITES_BIND
        components: ["default"]
  sitesApiPort:
    value: 5540
    targets:
      - pointer: SITES_API_PORT
        components: ["default"]
  genuiMcpPort:
    value: 5520
    targets:
      - pointer: GENUI_MCP_PORT
        components: ["default"]
  cuttingLaser2dPort:
    value: 5611
    targets:
      - pointer: CUTTING_LASER_2D_PORT
        components: ["default"]
  cuttingTubePort:
    value: 5612
    targets:
      - pointer: CUTTING_TUBE_PORT
        components: ["default"]
  cuttingPunchPort:
    value: 5613
    targets:
      - pointer: CUTTING_PUNCH_PORT
        components: ["default"]
  bendingPressPort:
    value: 5614
    targets:
      - pointer: BENDING_PRESS_PORT
        components: ["default"]
  opcuaAdapterBind:
    value: "127.0.0.1"
    targets:
      - pointer: OPCUA_ADAPTER_BIND
        components: ["default"]
  opcuaAdapterPort:
    value: 5560
    targets:
      - pointer: OPCUA_ADAPTER_PORT
        components: ["default"]
  opcSimulatorUiPort:
    value: 8090
    targets:
      - pointer: OPC_SIMULATOR_UI_PORT
        components: ["default"]
  dataRetention:
    value: "30.00:00:00"
    targets:
      - pointer: DATA_RETENTION
        components: ["default"]
  cardResourceDomains:
    value: ""
    targets:
      - pointer: CARD_RESOURCE_DOMAINS
        components: ["default"]
  llmBaseUrl:
    value: ""
    targets:
      - pointer: LLM_BASE_URL
        components: ["default"]
  llmApiKey:
    value: ""
    targets:
      - pointer: LLM_API_KEY
        components: ["default"]
  appMcpServers:
    value: ""
    targets:
      - pointer: APP_MCP_SERVERS
        components: ["default"]
  appDocumentationPackage:
    value: ""
    targets:
      - pointer: APP_DOCUMENTATION_PACKAGE
        components: ["default"]
  hubRegistration:
    value: true
    targets:
      - pointer: HUB_REGISTRATION
        components: ["default"]
  hubMqttUrl:
    value: "mqtt://broker:1883"
    targets:
      - pointer: HUB_MQTT_URL
        components: ["default"]
  hubAppUrl:
    value: ""
    targets:
      - pointer: HUB_APP_URL
        components: ["default"]

configuration:
  sections:
    - name: Network
      settings:
        - parameter: appHost
          name: Host name of the app
          description: >-
            The name (a CNAME of the device) under which Traefik serves the example app on the HTTP port. The
            default is a placeholder; set the name of your device.
          schema: hostName
        - parameter: serverHost
          name: Host name of the device
          description: >-
            The name of the device itself (its A record); Traefik serves the example app under it as well. The
            default is a placeholder; set the name of your device.
          schema: hostName
        - parameter: httpBind
          name: Address of Traefik
          description: >-
            The address Traefik answers on, over HTTP and HTTPS. 127.0.0.1 keeps it on the device; 0.0.0.0
            opens the example app to the network under its host names. The chat has no sign-in and spends the key of its language model,
            so open it only to a network you control.
          schema: bindAddress
        - parameter: httpPort
          name: HTTP port of Traefik
          schema: port
        - parameter: httpsPort
          name: HTTPS port of Traefik
          description: >-
            Traefik serves the example app over HTTPS as well, with a self-signed certificate it generates
            itself: a browser warns until you accept it.
          schema: port
        - parameter: appBind
          name: Address of the example app
          description: >-
            The address the example app answers on. 127.0.0.1 keeps it on the device; 0.0.0.0 opens it to the
            network. The chat has no sign-in and spends the key of its language model, so open it only to a
            network you control.
          schema: bindAddress
        - parameter: appPort
          name: Port of the example app
          schema: port
        - parameter: mqttPort
          name: Port of the MQTT broker
          description: The broker accepts anonymous clients. Do not expose it to a network you do not control.
          schema: port
        - parameter: mqttWsPort
          name: Port of the MQTT broker over WebSockets
          schema: port
        - parameter: timeseriesApiPort
          name: Port of the time series API
          schema: port
        - parameter: eventsApiPort
          name: Port of the events API
          schema: port
        - parameter: sitesBind
          name: Address of the sites API
          description: >-
            The address the sites API answers on. 127.0.0.1 keeps it on the device; 0.0.0.0 opens it to the
            network. Writing a site or a placement needs no sign-in, so open it only to a network you control.
          schema: bindAddress
        - parameter: sitesApiPort
          name: Port of the sites API
          schema: port
        - parameter: genuiMcpPort
          name: Port of the generative UI MCP server
          schema: port
        - parameter: cuttingLaser2dPort
          name: Port of the page of the 2D laser
          description: The page answers on the device only (127.0.0.1).
          schema: port
        - parameter: cuttingTubePort
          name: Port of the page of the tube laser
          description: The page answers on the device only (127.0.0.1).
          schema: port
        - parameter: cuttingPunchPort
          name: Port of the page of the punching machine
          description: The page answers on the device only (127.0.0.1).
          schema: port
        - parameter: bendingPressPort
          name: Port of the page of the press brake
          description: The page answers on the network; it has no sign-in.
          schema: port
        - parameter: opcuaAdapterBind
          name: Address of the OPC UA adapter
          description: >-
            The address the management API of the OPC UA adapter answers on. 127.0.0.1 keeps it on the device;
            0.0.0.0 opens it to the network. Adding and removing a machine needs no sign-in, so open it only to a
            network you control.
          schema: bindAddress
        - parameter: opcuaAdapterPort
          name: Port of the OPC UA adapter
          schema: port
        - parameter: opcSimulatorUiPort
          name: Port of the web UI of the simulated OPC UA machine
          schema: port
    - name: Data
      settings:
        - parameter: dataRetention
          name: Retention
          description: How long time series and events are kept, as days.hours:minutes:seconds.
          schema: timeSpan
        - parameter: cardResourceDomains
          name: Card resource domains
          description: The origins a card may load the font of its host from, comma separated; none if empty.
          schema: optionalText
    - name: Language model
      settings:
        - parameter: llmBaseUrl
          name: Base URL of the LiteLLM gateway
          description: >-
            The address up to /v1, as the app reaches it from its container. The chat offers the models the
            gateway marks for chat. A gateway on the device itself is http://host.docker.internal:<port>/v1.
            Without it the chat says so; everything else works.
          schema: optionalText
        - parameter: llmApiKey
          name: API key of the LiteLLM gateway
          description: The key the gateway gave you. It stays on the device.
          schema: optionalText
        - parameter: appMcpServers
          name: Further MCP servers
          description: >-
            Further MCP servers for the chat, as name=address, separated by commas. Use an address the app
            reaches from its container. For the documentation app on this device:
            docs=http://host.docker.internal:3202/mcp. Its MCP listener and published port must be reachable
            from this container; a port published only on host loopback may not be reachable on Linux.
          schema: optionalText
        - parameter: appDocumentationPackage
          name: Documentation package
          description: >-
            Optional documentation package for this machine. When set, documentation searches, source
            reviews and answer evidence stay within this package. Empty: the chat discovers the package
            or asks which one to use. Requires the documentation MCP server in Further MCP servers.
          schema: optionalText
    - name: Pleiades Hub
      settings:
        - parameter: hubRegistration
          name: Register at the Pleiades Hub
          description: >-
            The example app tells the Pleiades Hub on the device that it is there, so the hub lists it. Off: the
            app does not register.
          schema: boolean
        - parameter: hubMqttUrl
          name: Broker of the hub
          description: >-
            The MQTT broker at which the example app registers at the Pleiades Hub, as the app reaches it from
            its container. Empty: the broker of this app, where the hub on the device looks.
          schema: optionalText
        - parameter: hubAppUrl
          name: Address of the example app for the hub
          description: >-
            The address under which a browser reaches the example app; the hub opens the app there. Empty:
            through Traefik, http://<Host name of the app>:<HTTP port of Traefik>/, which needs Address of
            Traefik open to the network for a browser on another computer. Set it when a browser reaches the app
            under another address. It should end with a slash.
          schema: optionalText
  schema:
    - name: port
      dataType: integer
      minValue: 1
      maxValue: 65535
      allowEmpty: false
    - name: hostName
      dataType: string
      regexMatch: "^[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?(\\.[A-Za-z0-9]([A-Za-z0-9-]*[A-Za-z0-9])?)*$"
      allowEmpty: false
    - name: bindAddress
      dataType: string
      regexMatch: "^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$"
      allowEmpty: false
    - name: timeSpan
      dataType: string
      regexMatch: "^[0-9]+\\.[0-9]{2}:[0-9]{2}:[0-9]{2}$"
      allowEmpty: false
    - name: optionalText
      dataType: string
      allowEmpty: true
    - name: boolean
      dataType: boolean
      allowEmpty: false
