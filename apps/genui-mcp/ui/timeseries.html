<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The card is light in every host. Naming both schemes still matters: where the scheme of a
      frame differs from its host's, a browser paints an opaque ground behind the frame.
    -->
    <meta name="color-scheme" content="light dark" />
    <title>Time series</title>
    <!--
      The host gives the frame the height the card announces. While it catches up with a card that
      grows, a scrollbar would show for a moment: the frame scrolls without one, so a host that caps
      the height still lets a person reach the bottom.
    -->
    <style>
      html {
        overflow-y: auto;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./timeseries.tsx"></script>
  </body>
</html>
