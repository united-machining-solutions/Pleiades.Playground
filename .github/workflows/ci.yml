name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A manual run checks everything, whatever changed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      typescript: ${{ steps.filter.outputs.typescript }}
      stack: ${{ steps.filter.outputs.stack }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            dotnet:
              - 'source/**'
              - 'global.json'
              - '.github/workflows/ci.yml'
            typescript:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
            stack:
              - 'source/**'
              - 'apps/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - '.dockerignore'
              - 'stacks/**'
              - 'compose.yaml'
              - '.env.example'
              - '.github/workflows/ci.yml'

  dotnet:
    name: .NET build and test
    needs: changes
    if: needs.changes.outputs.dotnet == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: source/Directory.Packages.props
      - name: Build
        working-directory: source
        run: dotnet build Pleiades.Playground.slnx -c Release
      - name: Test
        working-directory: source
        run: dotnet test --solution Pleiades.Playground.slnx -c Release --no-build

  typescript:
    name: TypeScript build and test
    needs: changes
    if: needs.changes.outputs.typescript == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  stack:
    name: Demo stack starts healthy
    needs: changes
    if: needs.changes.outputs.stack == 'true' || github.event_name == 'workflow_dispatch'
    # Pinned: MongoDB 8.0 does not start on the kernel of the newest runner image.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: The APIs answer
        run: |
          curl -fsS http://localhost:5500/health
          curl -fsS http://localhost:5510/health
          curl -fsS http://localhost:5500/openapi/v1.json -o /dev/null
          curl -fsS http://localhost:5510/openapi/v1.json -o /dev/null
      - name: The generative UI backend answers
        run: |
          curl -fsS http://localhost:5520/health
          curl -fsS -X POST http://localhost:5520/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q genui_machine_list
      - name: The app answers
        run: |
          curl -fsS http://localhost:5600/health
          # The document must link a stylesheet that the server actually has.
          stylesheet=$(curl -fsS http://localhost:5600/ | grep -o '/assets/[^"]*\.css' | head -n 1)
          curl -fsS "http://localhost:5600${stylesheet}" -o /dev/null
          # The stack starts without a language model, and the chat must say so.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5600/api/harness/sessions)" = 503
      - name: The simulator's values arrive
        run: |
          sleep 30
          curl -fsS "http://localhost:5500/topics?startTime=$(date -u -d '-10 minutes' +%FT%TZ)&stopTime=$(date -u +%FT%TZ)" | tee topics.json
          grep -q "umati" topics.json
      - name: The backend lists the simulated machines
        run: |
          curl -fsS -X POST http://localhost:5520/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"genui_machine_list","arguments":{}}}' \
            | tee machines.txt
          grep -q "P-04" machines.txt
      - name: The backend shows one machine with its history
        run: |
          curl -fsS -X POST http://localhost:5520/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"genui_machine_show","arguments":{"machine":"P-04"}}}' \
            | tee machine.txt
          # The text says the machine in words, and the sums of the history come from the server.
          grep -q '"text":"P-04: ' machine.txt
          grep -q '"totals"' machine.txt
          # What a language model reads stays short: the spans of the band are not in it.
          if grep -q '"spans"' machine.txt; then echo "The result of genui_machine_show carries spans."; exit 1; fi
      - name: The backend lists the spans of a card's band
        run: |
          curl -fsS -X POST http://localhost:5520/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"genui_span_list\",\"arguments\":{\"machine\":\"P-04\",\"from\":\"$(date -u -d '-10 minutes' +%FT%TZ)\",\"to\":\"$(date -u +%FT%TZ)\"}}}" \
            | tee spans.txt
          grep -q '"spans":\[{"state"' spans.txt
      - name: The backend serves the machine card as an MCP App
        run: |
          curl -fsS -X POST http://localhost:5520/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"resources/read","params":{"uri":"ui://genui/machine"}}' \
            -o card.txt
          # The built file, with the media type a host knows an MCP App by.
          grep -q 'text/html;profile=mcp-app' card.txt
          grep -q '<!doctype html>' card.txt
          # It draws its own frame and says so, and it carries its notices.
          grep -q '"prefersBorder":false' card.txt
          grep -q 'Notices for the software in this file' card.txt
      - name: The TypeScript images carry the licence and the notices
        run: |
          for service in genui-mcp app; do
            docker compose exec -T "$service" sh -c 'test -s /app/LICENSE && grep -q "Pleiades Playground" /app/NOTICE'
          done
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  # Runs on every change: a link breaks when its target moves, not when the page that holds it changes.
  links:
    name: Links between files resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Check the links of the markdown files
        run: node .github/scripts/check-doc-links.mjs

  # A single required check that also passes when a job above was skipped by the path filter.
  ci:
    name: CI result
    if: always()
    needs: [dotnet, typescript, stack, links]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
