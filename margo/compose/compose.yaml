# Pleiades Playground demo stack as the component of the Margo app (see margo/README.md).
#
#   simulator ──MQTT──▶ broker ──▶ timeseries-persistence ──REST──▶ timeseries-api ──▶ mongodb
#                          └─────▶ events-persistence ─────REST──▶ events-api ──────▶ mongodb
#   browser ──HTTP(S)──▶ traefik ──▶ app ──MCP──▶ genui-mcp ──▶ both APIs
#   browser ──WS :9001, or WSS at /mqtt of traefik──▶ broker (live values)
#
# The same stack as compose.yaml at the root of the repository, in the form bart accepts:
# - no `build:`: the images are the ones the workflow "Images" publishes to ghcr.io;
# - every image is a literal reference: bart mirrors each one as it stands and does not interpolate it;
# - no YAML anchors or merge keys: bart's compose parser does not resolve them, so each service says
#   everything itself;
# - no bind mount and no config file: the configurations of the broker and of Traefik are `configs:` with
#   inline `content:`, and Traefik reads its routes from that config rather than from the Docker socket.
# Every ${VAR} is a parameter in app/margo.yaml; the default after `:-` is the same as the value there.
# A machine publishes after the umati data model, in its units (energy in watt hours); a place below sites/
# keeps the coherent SI units (contracts/mqtt).

services:
  broker:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    configs:
      - source: mosquitto
        target: /mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/version", "-C", "1", "-W", "3"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      # Time-series collections need a writable primary: initiate the single-node replica set on the
      # first pass and report healthy once it is primary.
      test: >-
        HOME=/tmp mongosh --quiet --eval "try { if (!db.hello().isWritablePrimary) throw new Error('not primary') }
        catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}); throw e }"
      start_period: 15s
      interval: 5s
      timeout: 10s
      retries: 30

  timeseries-api:
    image: ghcr.io/united-machining-solutions/pleiades.playground.timeseries.api:main
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${TIMESERIES_API_PORT:-5500}:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      # The services require a Loki sink in their configuration; the demo disables it.
      Config__Loki__Sinks__0__Name: demo
      Config__Loki__Sinks__0__Enabled: "false"
      Config__Loki__Sinks__0__Uri: http://localhost:3100
      Config__MongoTimeseries__ConnectionString: mongodb://mongodb:27017/?replicaSet=rs0
      Config__MongoTimeseries__DatabaseName: Timeseries
      Config__MongoTimeseries__DataRetentionPeriod: ${DATA_RETENTION:-30.00:00:00}
      # Authorization is implemented and switched off for the demo.
      Config__Auth__Enabled: "false"

  timeseries-persistence:
    image: ghcr.io/united-machining-solutions/pleiades.playground.timeseries.persistence:main
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      broker:
        condition: service_healthy
      timeseries-api:
        condition: service_healthy
    environment:
      Config__Loki__Sinks__0__Name: demo
      Config__Loki__Sinks__0__Enabled: "false"
      Config__Loki__Sinks__0__Uri: http://localhost:3100
      Config__MqttSource__ConnectionString: mqtt://broker:1883
      Config__MqttSource__User: ""
      Config__MqttSource__Password: ""
      Config__MqttSource__ClientId: timeseries-persistence
      Config__Topics__0: machines/+/umati/#
      Config__Topics__1: machines/+/oem/#
      # Values about a place, see contracts/mqtt. A first level the binding does not name is not stored.
      Config__Topics__2: sites/+/#
      Config__CachingTime: "00:00:05"
      Config__TimeseriesApi__Uri: http://timeseries-api:8080

  events-api:
    image: ghcr.io/united-machining-solutions/pleiades.playground.events.api:main
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${EVENTS_API_PORT:-5510}:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      Config__Loki__Sinks__0__Name: demo
      Config__Loki__Sinks__0__Enabled: "false"
      Config__Loki__Sinks__0__Uri: http://localhost:3100
      Config__MongoDb__ConnectionString: mongodb://mongodb:27017/?replicaSet=rs0
      Config__MongoDb__DatabaseName: Events
      Config__MongoDb__DataRetentionPeriod: ${DATA_RETENTION:-30.00:00:00}
      Config__Auth__Enabled: "false"

  events-persistence:
    image: ghcr.io/united-machining-solutions/pleiades.playground.events.persistence:main
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      broker:
        condition: service_healthy
      events-api:
        condition: service_healthy
    environment:
      Config__Loki__Sinks__0__Name: demo
      Config__Loki__Sinks__0__Enabled: "false"
      Config__Loki__Sinks__0__Uri: http://localhost:3100
      Config__MqttSource__ConnectionString: mqtt://broker:1883
      Config__MqttSource__User: ""
      Config__MqttSource__Password: ""
      Config__MqttSource__ClientId: events-persistence
      # A persistent session: the broker keeps the CloudEvents (QoS 1) while the service restarts.
      Config__MqttSource__CleanSession: "false"
      Config__MqttSource__SessionExpiry: "1.00:00:00"
      Config__Topics__0: machines/+/events/jobs
      Config__Topics__1: machines/+/events/workmasters
      Config__Topics__2: machines/+/events/notifications
      Config__EventsApi__Uri: http://events-api:8080

  # Sites and the machines placed on them, as people enter them.
  sites-api:
    image: ghcr.io/united-machining-solutions/pleiades.playground.sites.api:main
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      # Writing needs no sign-in in the demo: this computer only, unless SITES_BIND opens it.
      - "${SITES_BIND:-127.0.0.1}:${SITES_API_PORT:-5540}:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      Config__Loki__Sinks__0__Name: demo
      Config__Loki__Sinks__0__Enabled: "false"
      Config__Loki__Sinks__0__Uri: http://localhost:3100
      Config__MongoDb__ConnectionString: mongodb://mongodb:27017/?replicaSet=rs0
      Config__MongoDb__DatabaseName: Sites
      Config__Auth__Enabled: "false"

  # The generative UI backend: an MCP server that reads both APIs.
  genui-mcp:
    image: ghcr.io/united-machining-solutions/pleiades.playground.genui.mcp:main
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${GENUI_MCP_PORT:-5520}:8080"
    depends_on:
      timeseries-api:
        condition: service_healthy
      events-api:
        condition: service_healthy
    environment:
      TIMESERIES_API_URL: http://timeseries-api:8080
      EVENTS_API_URL: http://events-api:8080
      SITES_API_URL: http://sites-api:8080
      # The origins a card file may load the font of its host from; none unless set.
      CARD_RESOURCE_DOMAINS: ${CARD_RESOURCE_DOMAINS:-}

  # The example application.
  app:
    image: ghcr.io/united-machining-solutions/pleiades.playground.app:main
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      # The chat has no sign-in, and with a key set it spends that key. So the app answers on the
      # device only, unless APP_BIND opens it to the network.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-5600}:8080"
    depends_on:
      genui-mcp:
        condition: service_healthy
    # A model server on the device is host.docker.internal. Docker Desktop knows the name; this line
    # gives it to Docker Engine on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GENUI_MCP_URL: http://genui-mcp:8080/mcp
      # Where Home places machines on sites and takes them off: the REST endpoints of the Sites API.
      SITES_API_URL: http://sites-api:8080
      # Further MCP servers for the chat, as name=address, separated by commas.
      APP_MCP_SERVERS: ${APP_MCP_SERVERS:-}
      APP_DOCUMENTATION_PACKAGE: ${APP_DOCUMENTATION_PACKAGE:-}
      # The browser hears live values at the broker's WebSocket: at the host of the page and this port, and on a
      # page over HTTPS at this path of Traefik, which forwards it to the broker (the broker speaks no TLS).
      MQTT_WS_PORT: ${MQTT_WS_PORT:-9001}
      MQTT_WSS_PATH: /mqtt
      # The chat needs a language model; everything else works without one. The models come from a LiteLLM
      # gateway: the app offers those it marks for chat, and dictation takes the first it marks for speech
      # to text.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # The OPC UA adapter. While it does not answer, the chat leaves its tools and commands out.
      OPCUA_MCP_URL: http://opcua-adapter:8080/mcp
      OPCUA_ADAPTER_URL: http://opcua-adapter:8080
      # The app registers at the Pleiades Hub, at the broker of this stack. HUB_REGISTRATION=false switches that
      # off: a Margo client may leave an empty setting out, and then an empty broker would turn into the default.
      HUB_REGISTRATION: ${HUB_REGISTRATION:-true}
      HUB_MQTT_URL: ${HUB_MQTT_URL:-mqtt://broker:1883}
      # The address under which a browser reaches the app, where the hub opens it: through Traefik, under the host
      # name of the app. Over HTTP, because the hub is served over HTTP and loads the app into an iframe.
      HUB_APP_URL: ${HUB_APP_URL:-http://${APP_HOST:-pleiades.example.internal}:${HTTP_PORT:-80}/}

  # The reverse proxy in front of the example app, found by its host name. Not in compose.yaml at the root.
  traefik:
    image: traefik:v3.7.19
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command:
      - --global.checkNewVersion=false
      - --global.sendAnonymousUsage=false
      # Inside the container on an unprivileged port, so it needs no capability.
      - --entryPoints.web.address=:8000
      # HTTPS. No certificate is configured, so Traefik serves the self-signed one it generates at start, in
      # memory: the host names are internal to the device, and no public CA (and no ACME) can sign them.
      - --entryPoints.websecure.address=:8443
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      # /ping on the internal entry point "traefik" (:8080), which is not published.
      - --ping=true
    ports:
      # The same reason as for the app: Traefik answers on the device only, unless HTTP_BIND opens it to the
      # network. Its Host() rule is no guard, a client sets the Host header it likes.
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-80}:8000"
      - "${HTTP_BIND:-127.0.0.1}:${HTTPS_PORT:-443}:8443"
    configs:
      - source: traefik
        target: /etc/traefik/dynamic.yaml
    depends_on:
      app:
        condition: service_healthy
    environment:
      # The name of the app (a CNAME) and the name of the device (its A record); both lead to the app.
      APP_HOST: ${APP_HOST:-pleiades.example.internal}
      SERVER_HOST: ${SERVER_HOST:-device.example.internal}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 20

  # One simulator per machine. Each publishes after the data model, below machines/{MachineId}/
  # (<manufacturer>_<model>_<serial number>, contracts/mqtt), from a virtual machine of its own with a scenario of
  # its own kind of machine and a made-up manufacturer of its own.
  simulator-p-04:
    image: ghcr.io/united-machining-solutions/pleiades.playground.simulator:main
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      broker:
        condition: service_healthy
      # Healthy means the broker has acknowledged the subscriptions: an event sent before is lost for good.
      timeseries-persistence:
        condition: service_healthy
      events-persistence:
        condition: service_healthy
    environment:
      Config__Loki__Sinks__0__Name: demo
      Config__Loki__Sinks__0__Enabled: "false"
      Config__Loki__Sinks__0__Uri: http://localhost:3100
      Config__SerialNumber: P-04
      Config__MqttDestination__ConnectionString: mqtt://broker:1883
      Config__MqttDestination__ClientId: simulator-p-04
      # Shafts, flanges and bushings: the default scenario, machine id alcyone-machines_AX-400_P-04.

  simulator-p-07:
    image: ghcr.io/united-machining-solutions/pleiades.playground.simulator:main
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      broker:
        condition: service_healthy
      # Healthy means the broker has acknowledged the subscriptions: an event sent before is lost for good.
      timeseries-persistence:
        condition: service_healthy
      events-persistence:
        condition: service_healthy
    environment:
      Config__Loki__Sinks__0__Name: demo
      Config__Loki__Sinks__0__Enabled: "false"
      Config__Loki__Sinks__0__Uri: http://localhost:3100
      Config__SerialNumber: P-07
      Config__MqttDestination__ConnectionString: mqtt://broker:1883
      Config__MqttDestination__ClientId: simulator-p-07
      # Housings, machine id taygeta-precision_TP-800_P-07.
      Config__SpecOutput__ScenarioName: housings

  simulator-m-02:
    image: ghcr.io/united-machining-solutions/pleiades.playground.simulator:main
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      broker:
        condition: service_healthy
      # Healthy means the broker has acknowledged the subscriptions: an event sent before is lost for good.
      timeseries-persistence:
        condition: service_healthy
      events-persistence:
        condition: service_healthy
    environment:
      Config__Loki__Sinks__0__Name: demo
      Config__Loki__Sinks__0__Enabled: "false"
      Config__Loki__Sinks__0__Uri: http://localhost:3100
      Config__SerialNumber: M-02
      Config__MqttDestination__ConnectionString: mqtt://broker:1883
      Config__MqttDestination__ClientId: simulator-m-02
      # Small parts, machine id merope-microtec_MM-120_M-02.
      Config__SpecOutput__ScenarioName: small-parts

  # Cutting simulators: one machine each, speaking the telegram protocol through files in a volume of its own.
  # Its adapter (below) mounts the same volume at /exchange and has the same serial number: the simulator only
  # shows it, the telegrams do not carry it. The page of a simulator answers on the device only. In endless mode a
  # machine writes new orders and fills its stacks itself, so it works without anyone at its page.
  cutting-laser-2d:
    image: ghcr.io/united-machining-solutions/pleiades.playground.cutting.simulator:main
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${CUTTING_LASER_2D_PORT:-5611}:8080"
    environment:
      Config__MachineType: Laser2D
      Config__MachineNumber: "1"
      Config__MachineName: 2D laser
      Config__SerialNumber: L-01
      Config__EndlessMode: "true"
    volumes:
      - cutting-laser-2d-exchange:/exchange
      - cutting-laser-2d-data:/data

  cutting-tube:
    image: ghcr.io/united-machining-solutions/pleiades.playground.cutting.simulator:main
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${CUTTING_TUBE_PORT:-5612}:8080"
    environment:
      Config__MachineType: Tube
      Config__MachineNumber: "1"
      Config__MachineName: Tube laser
      Config__SerialNumber: T-01
      Config__EndlessMode: "true"
    volumes:
      - cutting-tube-exchange:/exchange
      - cutting-tube-data:/data

  cutting-punch:
    image: ghcr.io/united-machining-solutions/pleiades.playground.cutting.simulator:main
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${CUTTING_PUNCH_PORT:-5613}:8080"
    environment:
      Config__MachineType: Punch
      Config__MachineNumber: "1"
      Config__MachineName: Punching machine
      Config__SerialNumber: PU-01
      Config__EndlessMode: "true"
    volumes:
      - cutting-punch-exchange:/exchange
      - cutting-punch-data:/data

  # Cutting adapters: one per machine, the host side of the protocol. Each mounts the volume of its machine and
  # publishes the binding of machines below machines/trumpf_<Model>_<SerialNumber>/.
  cutting-adapter-laser-2d:
    image: ghcr.io/united-machining-solutions/pleiades.playground.cutting.adapter:main
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      broker:
        condition: service_healthy
      # Healthy means the broker has acknowledged the subscriptions: an event sent before is lost for good.
      timeseries-persistence:
        condition: service_healthy
      events-persistence:
        condition: service_healthy
      cutting-laser-2d:
        condition: service_started
    environment:
      Config__SerialNumber: L-01
      Config__Model: Laser2D
      Config__MachineNumber: "1"
      Config__MqttDestination__ConnectionString: mqtt://broker:1883
      Config__MqttDestination__ClientId: cutting-adapter-l-01
    volumes:
      - cutting-laser-2d-exchange:/exchange

  cutting-adapter-tube:
    image: ghcr.io/united-machining-solutions/pleiades.playground.cutting.adapter:main
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      broker:
        condition: service_healthy
      # Healthy means the broker has acknowledged the subscriptions: an event sent before is lost for good.
      timeseries-persistence:
        condition: service_healthy
      events-persistence:
        condition: service_healthy
      cutting-tube:
        condition: service_started
    environment:
      Config__SerialNumber: T-01
      Config__Model: Tube
      Config__MachineNumber: "1"
      Config__MqttDestination__ConnectionString: mqtt://broker:1883
      Config__MqttDestination__ClientId: cutting-adapter-t-01
    volumes:
      - cutting-tube-exchange:/exchange

  cutting-adapter-punch:
    image: ghcr.io/united-machining-solutions/pleiades.playground.cutting.adapter:main
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      broker:
        condition: service_healthy
      # Healthy means the broker has acknowledged the subscriptions: an event sent before is lost for good.
      timeseries-persistence:
        condition: service_healthy
      events-persistence:
        condition: service_healthy
      cutting-punch:
        condition: service_started
    environment:
      Config__SerialNumber: PU-01
      Config__Model: Punch
      Config__MachineNumber: "1"
      Config__MqttDestination__ConnectionString: mqtt://broker:1883
      Config__MqttDestination__ClientId: cutting-adapter-pu-01
    volumes:
      - cutting-punch-exchange:/exchange

  # Bending simulator: one press brake, reporting through RCI telegram files in a volume of its own. Its adapter
  # (below) mounts the same volume and has the same serial number, manufacturer, its web address and model: the
  # simulator only shows them, the telegrams do not carry them. Its page answers on the network; it has no sign-in.
  bending-press:
    image: ghcr.io/united-machining-solutions/pleiades.playground.bend.simulator:main
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "${BENDING_PRESS_PORT:-5614}:8080"
    environment:
      Config__SerialNumber: AE325085TB46
      Config__Manufacturer: TRUMPF
      Config__ManufacturerUri: https://www.trumpf.com
      Config__Model: "5085"
      Config__ExchangeDirectorySource: bending-press-exchange
    volumes:
      - bending-press-exchange:/exchange
      - bending-press-data:/data

  # Bending adapter: the host side of the files. It mounts the volume of its machine, read only, and publishes the
  # binding of machines below machines/trumpf_5085_AE325085TB46/.
  bending-adapter-press:
    image: ghcr.io/united-machining-solutions/pleiades.playground.bend.adapter:main
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      broker:
        condition: service_healthy
      # Healthy means the broker has acknowledged the subscriptions: an event sent before is lost for good.
      timeseries-persistence:
        condition: service_healthy
      events-persistence:
        condition: service_healthy
      bending-press:
        condition: service_started
    environment:
      Config__SerialNumber: AE325085TB46
      Config__Manufacturer: TRUMPF
      Config__ManufacturerUri: https://www.trumpf.com
      Config__Model: "5085"
      Config__MqttDestination__ConnectionString: mqtt://broker:1883
      Config__MqttDestination__ClientId: bend-adapter-AE325085TB46
    volumes:
      - bending-press-exchange:/exchange:ro

  # The OPC UA adapter: brings in the machines a person adds in the chat, by the binding of machines.
  #   opc-simulator ──OPC UA──▶ opcua-adapter ──MQTT──▶ broker
  opcua-adapter:
    image: ghcr.io/united-machining-solutions/pleiades.playground.opcua.adapter:main
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      # Whoever reaches this port can add and remove machines: it has no sign-in. So it answers on the
      # device only, unless OPCUA_ADAPTER_BIND opens it to the network.
      - "${OPCUA_ADAPTER_BIND:-127.0.0.1}:${OPCUA_ADAPTER_PORT:-5560}:8080"
    depends_on:
      broker:
        condition: service_healthy
      timeseries-persistence:
        condition: service_healthy
      events-persistence:
        condition: service_healthy
    environment:
      Config__Loki__Sinks__0__Name: demo
      Config__Loki__Sinks__0__Enabled: "false"
      Config__Loki__Sinks__0__Uri: http://localhost:3100
      Config__MqttDestination__ConnectionString: mqtt://broker:1883
      Config__MqttDestination__ClientId: opcua-adapter
      Config__DataDirectory: /data
    volumes:
      - opcua_adapter_data:/data

  # A machine to try the adapter with: the TRUMPF OPC UA simulator with a TruMatic, definition K09, as umati
  # publishes it. It is not registered with the adapter: a person adds it in the chat, /discover A1121O0001.
  opc-simulator:
    image: ghcr.io/umati/trumpf/edge/opc-simulator:1.4.0-alpha3
    restart: unless-stopped
    # The name the server announces in its endpoints and carries in its certificate, and the machine of the
    # definition.
    hostname: A1121O0001
    command: ["run", "-c", "/opt/opcsim/samples/definitions/K09.simulation.yaml"]
    ports:
      # The web UI of the simulator. Its OPC UA port, 4840, is reached inside the network of the app only.
      - "${OPC_SIMULATOR_UI_PORT:-8090}:8080"
    volumes:
      - opc_simulator_pki:/data/pki

# The configurations inline, as `content:`, not as `file:`: the Margo client does not mount a file of the
# package into a container. Compose interpolates ${VAR} in content, so a literal dollar sign is written $$.
configs:
  # The broker configuration of the stack; CI checks it is the same as stacks/broker/mosquitto.conf.
  mosquitto:
    content: |
      # Demo broker: anonymous access inside the compose network and on the published ports.
      # Do not expose this configuration to a network you do not control.
      persistence false
      log_dest stdout

      listener 1883
      protocol mqtt

      listener 9001
      protocol websockets

      allow_anonymous true
  # The dynamic configuration of Traefik (service traefik). Traefik renders it as a Go template before it
  # reads it, so the host names come from the environment of the container: APP_HOST and SERVER_HOST.
  traefik:
    content: |
      http:
        routers:
          app:
            entryPoints: [web]
            rule: 'Host(`{{ env "APP_HOST" }}`) || Host(`{{ env "SERVER_HOST" }}`)'
            service: app
          # The same route over HTTPS, with Traefik's own self-signed certificate. HTTP is not redirected: the app
          # works over both.
          app-secure:
            entryPoints: [websecure]
            rule: 'Host(`{{ env "APP_HOST" }}`) || Host(`{{ env "SERVER_HOST" }}`)'
            service: app
            tls: {}
          # A page over HTTPS may not open ws://, and the broker speaks no TLS: its WebSocket over HTTPS is this
          # path of Traefik (MQTT_WSS_PATH of the app). Over HTTP the page reaches the published port itself.
          broker-secure:
            entryPoints: [websecure]
            rule: '(Host(`{{ env "APP_HOST" }}`) || Host(`{{ env "SERVER_HOST" }}`)) && Path(`/mqtt`)'
            service: broker
            tls: {}
        services:
          app:
            loadBalancer:
              servers:
                - url: http://app:8080
          broker:
            loadBalancer:
              servers:
                - url: http://broker:9001

volumes:
  mongodb_data:
  cutting-laser-2d-exchange:
  cutting-laser-2d-data:
  cutting-tube-exchange:
  cutting-tube-data:
  cutting-punch-exchange:
  cutting-punch-data:
  bending-press-exchange:
  bending-press-data:
  opcua_adapter_data:
  opc_simulator_pki:
