version: 2
updates:
  - package-ecosystem: nuget
    directory: /source
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      serilog:
        patterns: ["Serilog*"]
    # The solution targets .NET 10. Packages of the next major version arrive with the move to the next .NET.
    ignore:
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /source/Pleiades.Playground.Timeseries.Api
      - /source/Pleiades.Playground.Timeseries.Persistence
      - /source/Pleiades.Playground.Events.Api
      - /source/Pleiades.Playground.Events.Persistence
      - /source/Pleiades.Playground.Simulator
      - /apps/genui-mcp
      - /apps/playground-app
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
