name: Bug
description: Something does not work as documented
labels: [bug]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Timeseries
        - Events
        - Simulator
        - Demo stack (compose)
        - Apps and cards
        - Contracts
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got. Remove secrets and host names.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: text
