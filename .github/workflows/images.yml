name: Images

# Builds the images, for linux/amd64 only, and pushes them to the GitHub Container Registry.
# Every push to main publishes the tags `main` and `sha-<commit>`; a version tag (v1.2.3) publishes `1.2.3`
# and then pushes the Margo app of that version with the workflow "Margo push".
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pleiades.playground.timeseries.api
            context: source
            file: source/Pleiades.Playground.Timeseries.Api/Dockerfile
          - image: pleiades.playground.timeseries.persistence
            context: source
            file: source/Pleiades.Playground.Timeseries.Persistence/Dockerfile
          - image: pleiades.playground.events.api
            context: source
            file: source/Pleiades.Playground.Events.Api/Dockerfile
          - image: pleiades.playground.events.persistence
            context: source
            file: source/Pleiades.Playground.Events.Persistence/Dockerfile
          - image: pleiades.playground.sites.api
            context: source
            file: source/Pleiades.Playground.Sites.Api/Dockerfile
          - image: pleiades.playground.simulator
            context: source
            file: source/Pleiades.Playground.Simulator/Dockerfile
          - image: pleiades.playground.cutting.simulator
            context: source
            file: source/Pleiades.Playground.Cutting.Simulator/Dockerfile
          - image: pleiades.playground.cutting.adapter
            context: source
            file: source/Pleiades.Playground.Cutting.Adapter/Dockerfile
          - image: pleiades.playground.bend.simulator
            context: source
            file: source/Pleiades.Playground.Bend.Simulator/Dockerfile
          - image: pleiades.playground.bend.adapter
            context: source
            file: source/Pleiades.Playground.Bend.Adapter/Dockerfile
          - image: pleiades.playground.ultimaker.api
            context: source
            file: source/Pleiades.Playground.Ultimaker.Api/Dockerfile
          - image: pleiades.playground.ultimaker.telemetry
            context: source
            file: source/Pleiades.Playground.Ultimaker.Telemetry/Dockerfile
          - image: pleiades.playground.juicebar.api
            context: source
            file: source/Pleiades.Playground.JuiceBar.Api/Dockerfile
          - image: pleiades.playground.opcua.adapter
            context: source
            file: source/Pleiades.Playground.OpcUa.Adapter/Dockerfile
          - image: pleiades.playground.genui.mcp
            context: .
            file: apps/genui-mcp/Dockerfile
          - image: pleiades.playground.simplecam.adapter
            context: .
            file: apps/simplecam-adapter-9042/Dockerfile
          - image: pleiades.playground.app
            context: .
            file: apps/app/Dockerfile
          # The same app, built with its showcases: pages made for one demo or one fair. The image above has
          # nothing of them in it (docs/adr/0018-a-showcase-is-built-in-on-request-and-only-adds.md).
          - image: pleiades.playground.app.showcases
            context: .
            file: apps/app/Dockerfile
            build-args: SHOWCASES=true
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,prefix=sha-
      - name: Version for the assemblies
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v7
        id: push
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          # amd64 only: some images the stack runs, such as the OPC UA simulator of umati, exist for amd64 only.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The .NET images compile the version in; the app shows the version and the commit in its sidebar,
          # as a link into the repository. genui-mcp uses none of them.
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
            ${{ matrix.build-args }}
          sbom: true
          provenance: mode=max
      # GitHub stores attestations for public repositories only (private ones need an enterprise plan).
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # A release: the Margo app of this version, with exactly the images above. Only for a version tag, never for main.
  margo-push:
    name: Margo app
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/margo-push.yml
    # Only the two it needs. Kept in the environment margo-staging, they reach the job there and these stay empty.
    secrets:
      BART_REGISTRY_USER: ${{ secrets.BART_REGISTRY_USER }}
      BART_REGISTRY_TOKEN: ${{ secrets.BART_REGISTRY_TOKEN }}
    with:
      version: ${{ github.ref_name }}
