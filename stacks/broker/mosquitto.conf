# Demo broker: anonymous access inside the compose network and on the published ports.
# Do not expose this configuration to a network you do not control.
# Sessions and their queued messages survive a restart of the broker. The Events persistence keeps a persistent
# session and acknowledges an event only once it is stored, so while it or the Events API is away the events wait
# here: up to 50 000 for a session, some four days at the rate of the demo (about 520 events an hour).
persistence true
persistence_location /mosquitto/data/
autosave_interval 60
max_queued_messages 50000
log_dest stdout

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true
