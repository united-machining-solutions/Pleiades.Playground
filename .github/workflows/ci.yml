name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      stack: ${{ steps.filter.outputs.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dotnet:
              - 'source/**'
              - 'global.json'
              - '.github/workflows/ci.yml'
            stack:
              - 'source/**'
              - 'stacks/**'
              - 'compose.yaml'
              - '.env.example'
              - '.github/workflows/ci.yml'

  dotnet:
    name: .NET build and test
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: source/Directory.Packages.props
      - name: Build
        working-directory: source
        run: dotnet build Pleiades.Playground.slnx -c Release
      - name: Test
        working-directory: source
        run: dotnet test --solution Pleiades.Playground.slnx -c Release --no-build

  stack:
    name: Demo stack starts healthy
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: The APIs answer
        run: |
          curl -fsS http://localhost:5500/health
          curl -fsS http://localhost:5510/health
          curl -fsS http://localhost:5500/openapi/v1.json -o /dev/null
          curl -fsS http://localhost:5510/openapi/v1.json -o /dev/null
      - name: The simulator's values arrive
        run: |
          sleep 30
          curl -fsS "http://localhost:5500/topics?startTime=$(date -u -d '-10 minutes' +%FT%TZ)&stopTime=$(date -u +%FT%TZ)" | tee topics.json
          grep -q "umati" topics.json
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  # A single required check that also passes when a job above was skipped by the path filter.
  ci:
    name: CI result
    if: always()
    needs: [dotnet, stack]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
