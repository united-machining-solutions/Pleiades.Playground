<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 548" role="img" aria-labelledby="title desc"
     font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">The way of a value through the repository, and where an idea starts</title>
  <desc id="desc">Four steps from the bottom up, each with its folder and its language. A source, a simulator
    under source/ or an adapter of your own, publishes to the broker over MQTT as contracts/mqtt says. The
    .NET services under source/ store the values and serve them over REST as contracts/openapi says. A tool in
    apps/genui-mcp computes an answer that a card of packages/cards draws; it is called over MCP as
    contracts/mcp says. A page in apps/app shows the card. A page starts at the top step, a card at the step
    of the card and its tool, a source at the bottom step.</desc>
  <defs>
    <!-- Both point along their line: "auto" turns them. -->
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#9ca3af"/>
    </marker>
    <marker id="to" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#0369a1"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="547" rx="12" fill="#ffffff" stroke="#e5e7eb"/>

  <!-- A value travels up. -->
  <line x1="62" y1="476" x2="62" y2="48" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#up)"/>
  <text x="46" y="262" font-size="13" fill="#6b7280" text-anchor="middle" transform="rotate(-90 46 262)">a value travels up</text>

  <!-- The four steps, top to bottom: title and language, folders, what happens there. -->
  <g font-size="13" fill="#6b7280">
    <rect x="96" y="36" width="484" height="84" rx="10" fill="#ffffff" stroke="#d1d5db"/>
    <text x="116" y="64" font-size="17" font-weight="600" fill="#111827">Page</text>
    <text x="560" y="64" text-anchor="end" font-size="12">TypeScript</text>
    <text x="116" y="86" font-family="ui-monospace, Consolas, monospace" fill="#374151">apps/app</text>
    <text x="116" y="106">pages and the chat; in the chat a language model picks the tool</text>

    <rect x="96" y="156" width="484" height="84" rx="10" fill="#ffffff" stroke="#d1d5db"/>
    <text x="116" y="184" font-size="17" font-weight="600" fill="#111827">Card and its tool</text>
    <text x="560" y="184" text-anchor="end" font-size="12">TypeScript</text>
    <text x="116" y="206" font-family="ui-monospace, Consolas, monospace" fill="#374151">apps/genui-mcp, packages/cards</text>
    <text x="116" y="226">the tool computes an answer, the card draws it</text>

    <rect x="96" y="276" width="484" height="84" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="5 4"/>
    <text x="116" y="304" font-size="17" font-weight="600" fill="#111827">Stored values</text>
    <text x="560" y="304" text-anchor="end" font-size="12">.NET</text>
    <text x="116" y="326" font-family="ui-monospace, Consolas, monospace" fill="#374151">source/*.Persistence, source/*.Api</text>
    <text x="116" y="346">kept for you: the persistence listens to the broker, the APIs serve</text>

    <rect x="96" y="396" width="484" height="84" rx="10" fill="#ffffff" stroke="#d1d5db"/>
    <text x="116" y="424" font-size="17" font-weight="600" fill="#111827">Source</text>
    <text x="560" y="424" text-anchor="end" font-size="12">.NET, or any language</text>
    <text x="116" y="446" font-family="ui-monospace, Consolas, monospace" fill="#374151">source/*.Simulator, or your adapter</text>
    <text x="116" y="466">a machine or a place publishes to the broker</text>
  </g>

  <!-- Between two steps: how they talk, and the contract that says how. -->
  <g font-size="12.5" stroke="none">
    <line x1="116" y1="120" x2="116" y2="156" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="130" y="142" font-weight="600" fill="#374151">MCP</text>
    <text x="166" y="142" font-family="ui-monospace, Consolas, monospace" fill="#6b7280">contracts/mcp</text>

    <line x1="116" y1="240" x2="116" y2="276" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="130" y="262" font-weight="600" fill="#374151">REST</text>
    <text x="170" y="262" font-family="ui-monospace, Consolas, monospace" fill="#6b7280">contracts/openapi</text>

    <line x1="116" y1="360" x2="116" y2="396" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="130" y="382" font-weight="600" fill="#374151">MQTT</text>
    <text x="172" y="382" font-family="ui-monospace, Consolas, monospace" fill="#6b7280">contracts/mqtt</text>
  </g>
  <text x="96" y="516" font-size="12.5" fill="#6b7280">Between two steps stands an agreed interface. A change there starts with an issue.</text>

  <!-- Where an idea starts. -->
  <g font-size="14" font-weight="600" fill="#0369a1">
    <line x1="668" y1="78" x2="594" y2="78" stroke="#0369a1" stroke-width="1.5" marker-end="url(#to)"/>
    <rect x="668" y="60" width="180" height="36" rx="18" fill="#e0f2fe"/>
    <text x="758" y="83" text-anchor="middle">A page starts here</text>

    <line x1="668" y1="198" x2="594" y2="198" stroke="#0369a1" stroke-width="1.5" marker-end="url(#to)"/>
    <rect x="668" y="180" width="180" height="36" rx="18" fill="#e0f2fe"/>
    <text x="758" y="203" text-anchor="middle">A card starts here</text>

    <line x1="668" y1="438" x2="594" y2="438" stroke="#0369a1" stroke-width="1.5" marker-end="url(#to)"/>
    <rect x="668" y="420" width="180" height="36" rx="18" fill="#e0f2fe"/>
    <text x="758" y="443" text-anchor="middle">A source starts here</text>
    <text x="758" y="476" text-anchor="middle" font-size="12" font-weight="400" fill="#6b7280">and needs a card to be seen</text>
  </g>
</svg>
