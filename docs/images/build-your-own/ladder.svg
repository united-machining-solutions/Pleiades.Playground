<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 668" role="img" aria-labelledby="title desc"
     font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">The way of a value through the repository, and where an idea starts</title>
  <desc id="desc">Five steps from the bottom up, each with its folder and its language, and beside each step
    what one value looks like there. A source, a simulator under source/ or an adapter of your own, publishes
    one value to the broker over MQTT as contracts/mqtt says: "Executing". The .NET services under source/
    store every value with its time and serve them over REST as contracts/openapi says. A tool in
    apps/genui-mcp refines the stored values into an answer: Running since 08:39, for 3 h 12 min. It is called
    over MCP as contracts/mcp says. A card of packages/cards draws the answer. A page in apps/app imports the
    card and shows it, on a page or in the chat. A page starts at the top step, a card at the two steps of
    the answer and the card, a source at the bottom step. An agent can read the stored values over MCP, with
    nothing to build.</desc>
  <defs>
    <!-- Both point along their line: "auto" turns them. -->
    <marker id="up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#9ca3af"/>
    </marker>
    <marker id="to" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#0369a1"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="667" rx="12" fill="#ffffff" stroke="#e5e7eb"/>

  <!-- A value travels up, and at each step it has another form. -->
  <line x1="52" y1="604" x2="52" y2="44" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#up)"/>
  <text x="34" y="322" font-size="13" fill="#6b7280" text-anchor="middle" transform="rotate(-90 34 322)">a value travels up</text>
  <g fill="#9ca3af">
    <circle cx="52" cy="82" r="3.5"/>
    <circle cx="52" cy="202" r="3.5"/>
    <circle cx="52" cy="322" r="3.5"/>
    <circle cx="52" cy="442" r="3.5"/>
    <circle cx="52" cy="562" r="3.5"/>
  </g>
  <g font-size="12" fill="#374151">
    <text x="72" y="78" font-size="13" font-weight="600" fill="#111827">shown</text>
    <text x="72" y="96">on a page, or in the chat</text>

    <text x="72" y="192" font-size="13" font-weight="600" fill="#111827">drawn</text>
    <rect x="72" y="202" width="40" height="10" rx="2" fill="#9ca3af"/>
    <rect x="114" y="202" width="12" height="10" rx="2" fill="#d1d5db"/>
    <rect x="128" y="202" width="94" height="10" rx="2" fill="#374151"/>

    <text x="72" y="310" font-size="13" font-weight="600" fill="#111827">refined</text>
    <text x="72" y="328">Running since 08:39,</text>
    <text x="72" y="344">for 3 h 12 min</text>

    <text x="72" y="430" font-size="13" font-weight="600" fill="#111827">stored</text>
    <text x="72" y="448" font-size="11.5" font-family="ui-monospace, Consolas, monospace">08:39 "Executing"</text>
    <text x="72" y="464" font-size="11.5" font-family="ui-monospace, Consolas, monospace">08:31 "NotExecuting"</text>

    <text x="72" y="558" font-size="13" font-weight="600" fill="#111827">published</text>
    <text x="72" y="576" font-size="11.5" font-family="ui-monospace, Consolas, monospace">"Executing"</text>
  </g>

  <!-- The five steps, top to bottom: title and language, folders, what happens there. -->
  <g font-size="13" fill="#6b7280">
    <rect x="270" y="40" width="430" height="84" rx="10" fill="#ffffff" stroke="#d1d5db"/>
    <text x="290" y="68" font-size="17" font-weight="600" fill="#111827">Page</text>
    <text x="680" y="68" text-anchor="end" font-size="12">TypeScript</text>
    <text x="290" y="90" font-family="ui-monospace, Consolas, monospace" fill="#374151">apps/app</text>
    <text x="290" y="110">shows cards, on a page or in the chat</text>

    <rect x="270" y="160" width="430" height="84" rx="10" fill="#ffffff" stroke="#d1d5db"/>
    <text x="290" y="188" font-size="17" font-weight="600" fill="#111827">Card</text>
    <text x="680" y="188" text-anchor="end" font-size="12">TypeScript</text>
    <text x="290" y="210" font-family="ui-monospace, Consolas, monospace" fill="#374151">packages/cards</text>
    <text x="290" y="230">draws an answer, in the app and in other hosts</text>

    <rect x="270" y="280" width="430" height="84" rx="10" fill="#ffffff" stroke="#d1d5db"/>
    <text x="290" y="308" font-size="17" font-weight="600" fill="#111827">Answer</text>
    <text x="680" y="308" text-anchor="end" font-size="12">TypeScript</text>
    <text x="290" y="330" font-family="ui-monospace, Consolas, monospace" fill="#374151">apps/genui-mcp</text>
    <text x="290" y="350">a tool refines the stored values into an answer</text>

    <rect x="270" y="400" width="430" height="84" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-dasharray="5 4"/>
    <text x="290" y="428" font-size="17" font-weight="600" fill="#111827">Stored values</text>
    <text x="680" y="428" text-anchor="end" font-size="12">.NET</text>
    <text x="290" y="450" font-family="ui-monospace, Consolas, monospace" fill="#374151">source/*.Persistence, source/*.Api</text>
    <text x="290" y="470">kept for you: every value, with its time</text>

    <rect x="270" y="520" width="430" height="84" rx="10" fill="#ffffff" stroke="#d1d5db"/>
    <text x="290" y="548" font-size="17" font-weight="600" fill="#111827">Source</text>
    <text x="680" y="548" text-anchor="end" font-size="12">.NET, or any language</text>
    <text x="290" y="570" font-family="ui-monospace, Consolas, monospace" fill="#374151">source/*.Simulator, or your adapter</text>
    <text x="290" y="590">a machine or a place publishes to the broker</text>
  </g>

  <!-- Between two steps: how they talk, and the contract that says how. -->
  <g font-size="12.5" stroke="none">
    <line x1="290" y1="124" x2="290" y2="160" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="304" y="146" font-weight="600" fill="#374151">import</text>
    <text x="350" y="146" font-family="ui-monospace, Consolas, monospace" fill="#6b7280">@pleiades/cards</text>

    <line x1="290" y1="244" x2="290" y2="280" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="304" y="266" font-weight="600" fill="#374151">MCP</text>
    <text x="340" y="266" font-family="ui-monospace, Consolas, monospace" fill="#6b7280">contracts/mcp</text>

    <line x1="290" y1="364" x2="290" y2="400" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="304" y="386" font-weight="600" fill="#374151">REST</text>
    <text x="344" y="386" font-family="ui-monospace, Consolas, monospace" fill="#6b7280">contracts/openapi</text>

    <line x1="290" y1="484" x2="290" y2="520" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="304" y="506" font-weight="600" fill="#374151">MQTT</text>
    <text x="346" y="506" font-family="ui-monospace, Consolas, monospace" fill="#6b7280">contracts/mqtt</text>
  </g>
  <text x="270" y="640" font-size="12.5" fill="#6b7280">Between two steps stands how they talk. A change to a contract starts with an issue.</text>

  <!-- Where an idea starts. -->
  <g font-size="14" font-weight="600" fill="#111827" text-anchor="middle">
    <line x1="780" y1="82" x2="710" y2="82" stroke="#0369a1" stroke-width="1.5" marker-end="url(#to)"/>
    <rect x="780" y="64" width="180" height="36" rx="18" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
    <text x="870" y="87">A page starts here</text>

    <!-- A card is two steps at once: the answer and its drawing. -->
    <path d="M780 262H740M740 202V322" fill="none" stroke="#0369a1" stroke-width="1.5"/>
    <line x1="740" y1="202" x2="710" y2="202" stroke="#0369a1" stroke-width="1.5" marker-end="url(#to)"/>
    <line x1="740" y1="322" x2="710" y2="322" stroke="#0369a1" stroke-width="1.5" marker-end="url(#to)"/>
    <rect x="780" y="244" width="180" height="36" rx="18" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
    <text x="870" y="267">A card starts here</text>
    <text x="870" y="300" font-size="12" font-weight="400" fill="#6b7280">the answer and its card</text>

    <!-- Not something to build: an agent reads the stored values itself. -->
    <line x1="780" y1="442" x2="710" y2="442" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#up)"/>
    <rect x="780" y="424" width="180" height="36" rx="18" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="870" y="447" fill="#374151">An agent reads here</text>
    <text x="870" y="480" font-size="12" font-weight="400" fill="#6b7280">over MCP, nothing to build</text>

    <line x1="780" y1="562" x2="710" y2="562" stroke="#0369a1" stroke-width="1.5" marker-end="url(#to)"/>
    <rect x="780" y="544" width="180" height="36" rx="18" fill="#ffffff" stroke="#0369a1" stroke-width="1.5"/>
    <text x="870" y="567">A source starts here</text>
    <text x="870" y="600" font-size="12" font-weight="400" fill="#6b7280">and needs a card to be seen</text>
  </g>
</svg>
