name: Images

# Builds multi-architecture images and pushes them to the GitHub Container Registry.
# Every push to main publishes the tags `main` and `sha-<commit>`; a version tag (v1.2.3) publishes `1.2.3`.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: pleiades.playground.timeseries.api
            context: source
            file: source/Pleiades.Playground.Timeseries.Api/Dockerfile
          - image: pleiades.playground.timeseries.persistence
            context: source
            file: source/Pleiades.Playground.Timeseries.Persistence/Dockerfile
          - image: pleiades.playground.events.api
            context: source
            file: source/Pleiades.Playground.Events.Api/Dockerfile
          - image: pleiades.playground.events.persistence
            context: source
            file: source/Pleiades.Playground.Events.Persistence/Dockerfile
          - image: pleiades.playground.simulator
            context: source
            file: source/Pleiades.Playground.Simulator/Dockerfile
          - image: pleiades.playground.genui.mcp
            context: .
            file: apps/genui-mcp/Dockerfile
          - image: pleiades.playground.app
            context: .
            file: apps/app/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=ref,event=branch
            type=sha,prefix=sha-
      - name: Version for the assemblies
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v7
        id: push
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The .NET images compile this version in; the TypeScript images do not use it.
          build-args: VERSION=${{ steps.version.outputs.value }}
          sbom: true
          provenance: mode=max
      # GitHub stores attestations for public repositories only (private ones need an enterprise plan).
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
