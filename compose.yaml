# Pleiades Playground demo stack.
#
#   simulator ──MQTT──▶ broker ──▶ timeseries-persistence ──REST──▶ timeseries-api ──▶ mongodb
#                          └─────▶ events-persistence ─────REST──▶ events-api ──────▶ mongodb
#
# Start:  docker compose up -d --build
# The simulators publish after the data model, in its units (contracts/mqtt).
name: pleiades-playground

x-service: &service
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-build: &build
  context: ./source
  args:
    VERSION: ${PLEIADES_BUILD_VERSION:-0.0.1}

# The services require a Loki sink in their configuration; the demo disables it.
x-logging-env: &logging-env
  Config__Loki__Sinks__0__Name: demo
  Config__Loki__Sinks__0__Enabled: "false"
  Config__Loki__Sinks__0__Uri: http://localhost:3100

x-simulator: &simulator
  <<: *service
  image: ghcr.io/united-machining-solutions/pleiades.playground.simulator:${PLEIADES_VERSION:-dev}
  depends_on:
    broker:
      condition: service_healthy
    # A persistence service is healthy once the broker has acknowledged its subscriptions. Events are not
    # retained, so one a simulator sends before that is lost for good and stays a gap in its sequence.
    timeseries-persistence:
      condition: service_healthy
    events-persistence:
      condition: service_healthy

services:
  # Read-only printer observations, independent of the slicer and printer pairing.
  ultimaker-telemetry:
    <<: *service
    profiles: [ultimaker]
    image: ghcr.io/united-machining-solutions/pleiades.playground.ultimaker.telemetry:${PLEIADES_VERSION:-dev}
    build:
      <<: *build
      dockerfile: Pleiades.Playground.Ultimaker.Telemetry/Dockerfile
    depends_on:
      broker:
        condition: service_healthy
      timeseries-persistence:
        condition: service_healthy
    environment:
      Config__SerialNumber: ${ULTIMAKER_SERIAL_NUMBER:-UM3-01}
      Config__PrinterBaseUrl: ${ULTIMAKER_PRINTER_URL:-http://ultimaker.local/}
      Config__PollIntervalSecond: ${ULTIMAKER_POLL_INTERVAL_SECOND:-2}
      Config__MqttDestination__ConnectionString: ${ULTIMAKER_MQTT_URL:-mqtt://broker:1883}
      Config__MqttDestination__ClientId: ultimaker-telemetry-${ULTIMAKER_SERIAL_NUMBER:-UM3-01}
      Config__MqttDestination__User: ${ULTIMAKER_MQTT_USER:-}
      Config__MqttDestination__Password: ${ULTIMAKER_MQTT_PASSWORD:-}

  # Optional physical-printer service. Starting it never pairs or starts a print.
  ultimaker-api:
    <<: *service
    profiles: [ultimaker]
    image: ghcr.io/united-machining-solutions/pleiades.playground.ultimaker.api:${PLEIADES_VERSION:-dev}
    build:
      <<: *build
      dockerfile: Pleiades.Playground.Ultimaker.Api/Dockerfile
    ports:
      - "${ULTIMAKER_BIND:-127.0.0.1}:${ULTIMAKER_API_PORT:-5530}:8080"
    volumes:
      - ultimaker_data:/data
    environment:
      Config__Auth__Enabled: ${ULTIMAKER_AUTH_ENABLED:-false}
      Config__Auth__MetadataAddress: ${ULTIMAKER_AUTH_METADATA_ADDRESS:-}
      Config__Auth__ValidIssuer: ${ULTIMAKER_AUTH_VALID_ISSUER:-}
      Config__Auth__Audience: ${ULTIMAKER_AUTH_AUDIENCE:-}
      Ultimaker__PrinterBaseUrl: ${ULTIMAKER_PRINTER_URL:-http://ultimaker.local/}
      Ultimaker__EnablePrinting: ${ULTIMAKER_ENABLE_PRINTING:-false}
      Ultimaker__SliceTimeoutSecond: ${ULTIMAKER_SLICE_TIMEOUT_SECOND:-180}

  broker:
    image: eclipse-mosquitto:${MOSQUITTO_VERSION:-2}
    restart: unless-stopped
    ports:
      - "${MQTT_PORT:-1883}:1883"
      - "${MQTT_WS_PORT:-9001}:9001"
    volumes:
      - ./stacks/broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/broker/version", "-C", "1", "-W", "3"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:${MONGODB_VERSION:-8.0}
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      # Time-series collections need a writable primary: initiate the single-node replica set on the
      # first pass and report healthy once it is primary.
      test: >-
        HOME=/tmp mongosh --quiet --eval "try { if (!db.hello().isWritablePrimary) throw new Error('not primary') }
        catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}); throw e }"
      start_period: 15s
      interval: 5s
      timeout: 10s
      retries: 30

  timeseries-api:
    <<: *service
    image: ghcr.io/united-machining-solutions/pleiades.playground.timeseries.api:${PLEIADES_VERSION:-dev}
    build:
      <<: *build
      dockerfile: Pleiades.Playground.Timeseries.Api/Dockerfile
    ports:
      - "${TIMESERIES_API_PORT:-5500}:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      <<: *logging-env
      Config__MongoTimeseries__ConnectionString: mongodb://mongodb:27017/?replicaSet=rs0
      Config__MongoTimeseries__DatabaseName: Timeseries
      Config__MongoTimeseries__DataRetentionPeriod: ${DATA_RETENTION:-30.00:00:00}
      # Authorization is implemented and switched off for the demo.
      Config__Auth__Enabled: "false"

  timeseries-persistence:
    <<: *service
    image: ghcr.io/united-machining-solutions/pleiades.playground.timeseries.persistence:${PLEIADES_VERSION:-dev}
    build:
      <<: *build
      dockerfile: Pleiades.Playground.Timeseries.Persistence/Dockerfile
    depends_on:
      broker:
        condition: service_healthy
      timeseries-api:
        condition: service_healthy
    environment:
      <<: *logging-env
      Config__MqttSource__ConnectionString: mqtt://broker:1883
      Config__MqttSource__User: ""
      Config__MqttSource__Password: ""
      Config__MqttSource__ClientId: timeseries-persistence
      Config__Topics__0: machines/+/umati/#
      Config__Topics__1: machines/+/oem/#
      # Values about a place, see contracts/mqtt. A first level the binding does not name is not stored.
      Config__Topics__2: sites/+/#
      Config__CachingTime: "00:00:05"
      Config__TimeseriesApi__Uri: http://timeseries-api:8080

  events-api:
    <<: *service
    image: ghcr.io/united-machining-solutions/pleiades.playground.events.api:${PLEIADES_VERSION:-dev}
    build:
      <<: *build
      dockerfile: Pleiades.Playground.Events.Api/Dockerfile
    ports:
      - "${EVENTS_API_PORT:-5510}:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      <<: *logging-env
      Config__MongoDb__ConnectionString: mongodb://mongodb:27017/?replicaSet=rs0
      Config__MongoDb__DatabaseName: Events
      Config__MongoDb__DataRetentionPeriod: ${DATA_RETENTION:-30.00:00:00}
      Config__Auth__Enabled: "false"

  events-persistence:
    <<: *service
    image: ghcr.io/united-machining-solutions/pleiades.playground.events.persistence:${PLEIADES_VERSION:-dev}
    build:
      <<: *build
      dockerfile: Pleiades.Playground.Events.Persistence/Dockerfile
    depends_on:
      broker:
        condition: service_healthy
      events-api:
        condition: service_healthy
    environment:
      <<: *logging-env
      Config__MqttSource__ConnectionString: mqtt://broker:1883
      Config__MqttSource__User: ""
      Config__MqttSource__Password: ""
      Config__MqttSource__ClientId: events-persistence
      # A persistent session: the broker keeps the CloudEvents (QoS 1) while the service restarts.
      Config__MqttSource__CleanSession: "false"
      Config__MqttSource__SessionExpiry: "1.00:00:00"
      Config__Topics__0: machines/+/events/jobs
      Config__Topics__1: machines/+/events/workmasters
      Config__Topics__2: machines/+/events/notifications
      Config__EventsApi__Uri: http://events-api:8080

  # Sites and the machines placed on them, as people enter them.
  sites-api:
    <<: *service
    image: ghcr.io/united-machining-solutions/pleiades.playground.sites.api:${PLEIADES_VERSION:-dev}
    build:
      <<: *build
      dockerfile: Pleiades.Playground.Sites.Api/Dockerfile
    ports:
      # Writing needs no sign-in in the demo: this computer only, unless SITES_BIND opens it.
      - "${SITES_BIND:-127.0.0.1}:${SITES_API_PORT:-5540}:8080"
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      <<: *logging-env
      Config__MongoDb__ConnectionString: mongodb://mongodb:27017/?replicaSet=rs0
      Config__MongoDb__DatabaseName: Sites
      Config__Auth__Enabled: "false"

  # The generative UI backend: an MCP server that reads both APIs. The TypeScript images are built
  # from the repository root.
  genui-mcp:
    <<: *service
    image: ghcr.io/united-machining-solutions/pleiades.playground.genui.mcp:${PLEIADES_VERSION:-dev}
    build:
      context: .
      dockerfile: apps/genui-mcp/Dockerfile
    ports:
      - "${GENUI_MCP_PORT:-5520}:8080"
    depends_on:
      timeseries-api:
        condition: service_healthy
      events-api:
        condition: service_healthy
    environment:
      TIMESERIES_API_URL: http://timeseries-api:8080
      EVENTS_API_URL: http://events-api:8080
      # The site card reads it; without the Sites API only that card fails.
      SITES_API_URL: http://sites-api:8080
      # The origins a card file may load the font of its host from; none unless set.
      CARD_RESOURCE_DOMAINS: ${CARD_RESOURCE_DOMAINS:-}

  # A LiteLLM gateway of one's own, for a key of Anthropic or OpenAI without the gateway of the hackathon.
  # It starts only with the profile: docker compose --profile gateway up -d. The app then reaches it as
  # LLM_BASE_URL=http://litellm:4000/v1, and LLM_API_KEY is its master key, which LiteLLM wants: a key of
  # one's own choosing that begins with sk-. It publishes no port: only the containers of this stack reach
  # it. Its models are in stacks/litellm/config.yaml.
  litellm:
    <<: *service
    image: ghcr.io/berriai/litellm:${LITELLM_VERSION:-v1.109.1}
    profiles: [gateway]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./stacks/litellm/config.yaml:/app/config.yaml:ro
    environment:
      LITELLM_MASTER_KEY: ${LLM_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 12

  # A juice bar as a tool: its card and state over REST and MCP, an order on request, its state on the
  # broker. It starts only with the profile: docker compose --profile juicebar up -d. It needs a machine
  # that runs MixerControl at JUICEBAR_URL. It places orders and never starts the production: a person
  # presses the start button on the machine. JUICEBAR_ENABLE_ORDERING=false makes it read-only.
  juicebar-api:
    <<: *service
    profiles: [juicebar]
    image: ghcr.io/united-machining-solutions/pleiades.playground.juicebar.api:${PLEIADES_VERSION:-dev}
    build:
      <<: *build
      dockerfile: Pleiades.Playground.JuiceBar.Api/Dockerfile
    ports:
      # No sign-in, and it orders at a real machine: it answers on this computer only, unless
      # JUICEBAR_BIND opens it to the network. The containers of this stack reach it either way.
      - "${JUICEBAR_BIND:-127.0.0.1}:${JUICEBAR_API_PORT:-5550}:8080"
    depends_on:
      broker:
        condition: service_healthy
      timeseries-persistence:
        condition: service_healthy
    environment:
      # Sign-in is off for the demo. On: reading needs the permission juicebar:read, an order juicebar:write.
      Config__Auth__Enabled: ${JUICEBAR_AUTH_ENABLED:-false}
      Config__Auth__MetadataAddress: ${JUICEBAR_AUTH_METADATA_ADDRESS:-}
      Config__Auth__ValidIssuer: ${JUICEBAR_AUTH_VALID_ISSUER:-}
      Config__Auth__Audience: ${JUICEBAR_AUTH_AUDIENCE:-}
      Config__MqttDestination__ConnectionString: mqtt://broker:1883
      Config__MqttDestination__ClientId: juicebar-api-${JUICEBAR_SERIAL_NUMBER:-JUICEBAR-01}
      JuiceBar__BaseUrl: ${JUICEBAR_URL:-http://juicebar.local:3000/}
      JuiceBar__EnableOrdering: ${JUICEBAR_ENABLE_ORDERING:-true}
      JuiceBar__MaximumQueueLength: ${JUICEBAR_MAX_QUEUE_LENGTH:-3}
      # The machine id in every topic is <manufacturer>_<model>_<serial number>, by default
      # trumpf_JuiceBar_JUICEBAR-01: the juice bar of the demo was built by TRUMPF. The manufacturer is the domain
      # of its web address without www. and its ending, as the MQTT binding forms it.
      JuiceBar__ManufacturerUri: ${JUICEBAR_MANUFACTURER_URI:-https://www.trumpf.com}
      JuiceBar__ManufacturerName: ${JUICEBAR_MANUFACTURER_NAME:-TRUMPF}
      JuiceBar__Model: ${JUICEBAR_MODEL:-JuiceBar}
      JuiceBar__SerialNumber: ${JUICEBAR_SERIAL_NUMBER:-JUICEBAR-01}
      JuiceBar__Language: ${JUICEBAR_LANGUAGE:-en}

  # The example application.
  app:
    <<: *service
    image: ghcr.io/united-machining-solutions/pleiades.playground.app:${PLEIADES_VERSION:-dev}
    build:
      context: .
      dockerfile: apps/app/Dockerfile
    ports:
      # The chat has no sign-in, and with a key set it spends that key. So the app answers on this
      # computer only, unless APP_BIND opens it to the network.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-5600}:8080"
    depends_on:
      genui-mcp:
        condition: service_healthy
    # A model server on this computer is host.docker.internal. Docker Desktop knows the name; this line
    # gives it to Docker Engine on Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      GENUI_MCP_URL: http://genui-mcp:8080/mcp
      # The MCP servers of optional services whose tools the chat has too, see .env.example.
      APP_MCP_SERVERS: ${APP_MCP_SERVERS:-}
      # Where the browser hears live values at the broker: the host of the page and this port, or the whole
      # address of MQTT_WS_URL for a broker behind a proxy.
      MQTT_WS_PORT: ${MQTT_WS_PORT:-9001}
      MQTT_WS_URL: ${MQTT_WS_URL:-}
      # The OPC UA adapter. While it does not answer, the chat leaves its tools and commands out; empty,
      # the chat has no OPC UA.
      OPCUA_MCP_URL: ${OPCUA_MCP_URL-http://opcua-adapter:8080/mcp}
      OPCUA_ADAPTER_URL: ${OPCUA_ADAPTER_URL-http://opcua-adapter:8080}
      # The chat needs a language model; everything else works without one. The models come from a LiteLLM
      # gateway: the app offers those it marks for chat, and dictation takes the first it marks for speech
      # to text.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}

  # One simulator per machine. Each publishes after the data model, below machines/{MachineId}/
  # (<manufacturer>_<model>_<serial number>, contracts/mqtt), from a virtual machine of its own with a scenario of
  # its own kind of machine and a made-up manufacturer of its own.
  # All three run the same image. Only the first one builds it, or pulls it, so that happens once and not
  # three times; the other two take the image that is then on this computer (pull_policy: never).
  simulator-p-04:
    <<: *simulator
    build:
      <<: *build
      dockerfile: Pleiades.Playground.Simulator/Dockerfile
    environment:
      <<: *logging-env
      Config__SerialNumber: P-04
      Config__MqttDestination__ConnectionString: mqtt://broker:1883
      Config__MqttDestination__ClientId: simulator-p-04
      # Shafts, flanges and bushings: the default scenario, machine id alcyone-machines_AX-400_P-04.

  simulator-p-07:
    <<: *simulator
    pull_policy: never
    environment:
      <<: *logging-env
      Config__SerialNumber: P-07
      Config__MqttDestination__ConnectionString: mqtt://broker:1883
      Config__MqttDestination__ClientId: simulator-p-07
      # Housings, machine id taygeta-precision_TP-800_P-07.
      Config__SpecOutput__ScenarioName: housings

  simulator-m-02:
    <<: *simulator
    pull_policy: never
    environment:
      <<: *logging-env
      Config__SerialNumber: M-02
      Config__MqttDestination__ConnectionString: mqtt://broker:1883
      Config__MqttDestination__ClientId: simulator-m-02
      # Small parts, machine id merope-microtec_MM-120_M-02.
      Config__SpecOutput__ScenarioName: small-parts

  # OPC UA: machines that speak OPC UA, added in the chat.
  #
  #   opc-simulator ──OPC UA──▶ opcua-adapter ──MQTT──▶ broker
  #                                   └──REST, delete a removed machine──▶ timeseries-api, events-api
  #
  # The adapter runs every machine that is registered with it, from the registrations in its volume.
  # See source/Pleiades.Playground.OpcUa.Adapter/README.md.
  opcua-adapter:
    <<: *service
    image: ghcr.io/united-machining-solutions/pleiades.playground.opcua.adapter:${PLEIADES_VERSION:-dev}
    build:
      <<: *build
      dockerfile: Pleiades.Playground.OpcUa.Adapter/Dockerfile
    ports:
      # Whoever reaches this port can add and remove machines: it has no sign-in. So it answers on
      # this computer only, unless OPCUA_ADAPTER_BIND opens it to the network.
      - "${OPCUA_ADAPTER_BIND:-127.0.0.1}:${OPCUA_ADAPTER_PORT:-5560}:8080"
    depends_on:
      broker:
        condition: service_healthy
      timeseries-persistence:
        condition: service_healthy
      events-persistence:
        condition: service_healthy
    environment:
      <<: *logging-env
      Config__MqttDestination__ConnectionString: mqtt://broker:1883
      Config__MqttDestination__ClientId: opcua-adapter
      Config__DataDirectory: /data
    volumes:
      - opcua_adapter_data:/data

  # A machine to try the adapter with: the TRUMPF OPC UA simulator with a TruMatic, definition K09, as
  # umati publishes it. It is not registered with the adapter: a person adds it in the chat,
  # /discover A1121O0001. OPC_SIMULATOR_IMAGE names another image of it, for example one built on this
  # computer.
  opc-simulator:
    image: ${OPC_SIMULATOR_IMAGE:-ghcr.io/umati/trumpf/edge/opc-simulator:1.4.0-alpha3}
    restart: unless-stopped
    # The name the server announces in its endpoints and carries in its certificate, and the machine
    # of the definition.
    hostname: A1121O0001
    command: ["run", "-c", "/opt/opcsim/samples/definitions/K09.simulation.yaml"]
    ports:
      # The web UI of the simulator. Its OPC UA port, 4840, is reached inside the demo network only.
      - "${OPC_SIMULATOR_UI_PORT:-8090}:8080"
    volumes:
      - opc_simulator_pki:/data/pki

volumes:
  ultimaker_data:
  mongodb_data:
  opcua_adapter_data:
  opc_simulator_pki:
