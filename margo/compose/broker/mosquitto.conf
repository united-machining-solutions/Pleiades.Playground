# Copy of stacks/broker/mosquitto.conf for the Margo app: a bind mount may not leave margo/compose.
# Keep the two files the same; margo/README.md says how to check.
# Demo broker: anonymous access inside the compose network and on the published ports.
# Do not expose this configuration to a network you do not control.
persistence false
log_dest stdout

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true
