name: CI

on:
  pull_request:
  push:
    branches: [main]
  # A manual run checks everything, whatever changed.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      typescript: ${{ steps.filter.outputs.typescript }}
      stack: ${{ steps.filter.outputs.stack }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dotnet:
              - 'source/**'
              - 'global.json'
              - '.github/workflows/ci.yml'
            typescript:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - '.nvmrc'
              - '.github/workflows/ci.yml'
            stack:
              - 'source/**'
              - 'apps/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - '.dockerignore'
              - 'stacks/**'
              - 'compose.yaml'
              - '.env.example'
              - '.github/workflows/ci.yml'

  dotnet:
    name: .NET build and test
    needs: changes
    if: needs.changes.outputs.dotnet == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: source/Directory.Packages.props
      - name: Build
        working-directory: source
        run: dotnet build Pleiades.Playground.slnx -c Release
      - name: Test
        working-directory: source
        run: dotnet test --solution Pleiades.Playground.slnx -c Release --no-build

  typescript:
    name: TypeScript build and test
    needs: changes
    if: needs.changes.outputs.typescript == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the pnpm version from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  stack:
    name: Demo stack starts healthy
    needs: changes
    if: needs.changes.outputs.stack == 'true' || github.event_name == 'workflow_dispatch'
    # Pinned: MongoDB 8.0 does not start on the kernel of the newest runner image.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: The APIs answer
        run: |
          curl -fsS http://localhost:5500/health
          curl -fsS http://localhost:5510/health
          curl -fsS http://localhost:5500/openapi/v1.json -o /dev/null
          curl -fsS http://localhost:5510/openapi/v1.json -o /dev/null
      - name: The generative UI backend answers
        run: |
          curl -fsS http://localhost:5520/health
          curl -fsS -X POST http://localhost:5520/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q genui_machine_list
      - name: The app answers
        run: |
          curl -fsS http://localhost:5600/health
          # The document must link a stylesheet that the server actually has.
          stylesheet=$(curl -fsS http://localhost:5600/ | grep -o '/assets/[^"]*\.css' | head -n 1)
          curl -fsS "http://localhost:5600${stylesheet}" -o /dev/null
          # The stack starts without a language model, and the chat must say so.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5600/api/harness/sessions)" = 503
      - name: The simulator's values arrive
        run: |
          sleep 30
          curl -fsS "http://localhost:5500/topics?startTime=$(date -u -d '-10 minutes' +%FT%TZ)&stopTime=$(date -u +%FT%TZ)" | tee topics.json
          grep -q "umati" topics.json
      - name: The backend lists the simulated machines
        run: |
          curl -fsS -X POST http://localhost:5520/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"genui_machine_list","arguments":{}}}' \
            | tee machines.txt
          grep -q "P-04" machines.txt
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  # A single required check that also passes when a job above was skipped by the path filter.
  ci:
    name: CI result
    if: always()
    needs: [dotnet, typescript, stack]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
