<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 308" role="img" aria-labelledby="title desc"
     font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="title">A card and its server</title>
  <desc id="desc">On the left a host, the example app or any other, with a card in it. On the right two MCP
    servers, one above the other: the generative UI backend, whose tool answered, and any other MCP server,
    such as the Timeseries API or the Events API. The host calls a tool of the generative UI backend, and the
    answer brings the card. The card asks for more only at that server. Between the card and the other MCP
    server stands a sign: no call to another server. The generative UI backend reads the other server
    itself.</desc>
  <defs>
    <!-- They point along their line: "auto" turns them. -->
    <marker id="cb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#0369a1"/>
    </marker>
    <marker id="cg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="307" rx="12" fill="#ffffff" stroke="#e5e7eb"/>

  <g font-size="12" fill="#6b7280">
    <!-- The host, and the card it shows. -->
    <rect x="40" y="40" width="360" height="228" rx="10" fill="#ffffff" stroke="#d1d5db"/>
    <text x="56" y="66" font-size="15" font-weight="600" fill="#111827">A host</text>
    <text x="56" y="86">the example app, or any other</text>
    <rect x="64" y="104" width="312" height="144" rx="8" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="80" y="132" font-size="15" font-weight="600" fill="#111827">Card</text>
    <text x="80" y="154">came with the answer of a tool</text>
    <text x="80" y="170">and is drawn from its values</text>

    <!-- Its own server. -->
    <rect x="600" y="40" width="360" height="120" rx="10" fill="#ffffff" stroke="#d1d5db"/>
    <text x="616" y="66" font-size="15" font-weight="600" fill="#111827">Generative UI backend</text>
    <text x="944" y="66" text-anchor="end" font-family="ui-monospace, Consolas, monospace" fill="#374151">:5520</text>
    <text x="616" y="92">the server whose tool answered:</text>
    <text x="616" y="108">the card's own server</text>

    <!-- Any other one. -->
    <rect x="600" y="196" width="360" height="72" rx="10" fill="#ffffff" stroke="#d1d5db"/>
    <text x="616" y="222" font-size="15" font-weight="600" fill="#111827">Any other MCP server</text>
    <text x="616" y="246">the Timeseries API, the Events API, one you add</text>
  </g>

  <g fill="none" stroke-width="1.5">
    <line x1="400" y1="76" x2="600" y2="76" stroke="#0369a1" marker-end="url(#cb)"/>
    <line x1="376" y1="136" x2="600" y2="136" stroke="#0369a1" marker-end="url(#cb)"/>
    <line x1="680" y1="160" x2="680" y2="196" stroke="#6b7280" marker-end="url(#cg)"/>

    <!-- The one that is not there. -->
    <line x1="376" y1="232" x2="600" y2="232" stroke="#b91c1c" stroke-dasharray="5 4"/>
    <circle cx="500" cy="232" r="7.5" fill="#ffffff" stroke="#b91c1c"/>
    <line x1="494.7" y1="237.3" x2="505.3" y2="226.7" stroke="#b91c1c"/>
  </g>

  <g font-size="12" fill="#6b7280" text-anchor="middle">
    <text x="500" y="66"><tspan font-weight="600" fill="#0369a1">MCP</tspan> the host calls a tool</text>
    <text x="500" y="94">the answer brings the card</text>

    <text x="500" y="126"><tspan font-weight="600" fill="#0369a1">MCP</tspan> the card asks for more</text>
    <text x="500" y="154">only here, at its own server</text>

    <text x="500" y="214" font-weight="600" fill="#374151">no call to another server</text>
    <text x="500" y="258">blocked</text>
  </g>
  <text x="692" y="183" font-size="12" fill="#6b7280">its own server reads there instead</text>
</svg>
