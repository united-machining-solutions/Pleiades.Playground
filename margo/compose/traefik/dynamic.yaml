# Dynamic configuration of Traefik (see margo/compose/compose.yaml, service traefik).
# Traefik renders this file as a Go template before it reads it, so the host names come from the
# environment of the container: APP_HOST and SERVER_HOST, parameters in margo/app/margo.yaml.
http:
  routers:
    app:
      entryPoints: [web]
      rule: 'Host(`{{ env "APP_HOST" }}`) || Host(`{{ env "SERVER_HOST" }}`)'
      service: app
  services:
    app:
      loadBalancer:
        servers:
          - url: http://app:8080
